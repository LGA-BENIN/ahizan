x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  vendure:
    image: ahizan-vendure_v2
    build:
      context: .
      dockerfile: docker/vendure/Dockerfile
    container_name: ahizan_backend
    restart: unless-stopped
    privileged: true
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - STOREFRONT_URL=https://ahizan.com
      - ASSET_URL_PREFIX=https://api.ahizan.com/assets/
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL}
      # Autres variables Vendure
    labels:
      - "VIRTUAL_HOST=api.ahizan.com,administrator.ahizan.com"
      - "VIRTUAL_PORT=3000"
    networks:
      web:
        aliases:
          - ahizan_backend
      internal:
        aliases:
          - ahizan_backend
    volumes:
      - ./backend/static/assets:/usr/src/app/static/assets
    logging: *default-logging

  storefront:
    image: ahizan-storefront
    build:
      context: .
      dockerfile: docker/storefront/Dockerfile
    container_name: ahizan_storefront
    restart: unless-stopped
    privileged: true
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - VENDURE_SHOP_API_URL=http://ahizan_backend:3000/shop-api
      - NEXT_PUBLIC_VENDURE_SHOP_API_URL=https://api.ahizan.com/shop-api
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${VAPID_VAPID_PUBLIC_KEY:-${VAPID_PUBLIC_KEY}}
    labels:
      - "VIRTUAL_HOST=ahizan.com,www.ahizan.com"
      - "VIRTUAL_PORT=3000"
    networks:
      - web
      - internal
    logging: *default-logging

  seller:
    image: ahizan-seller
    build:
      context: .
      dockerfile: docker/seller/Dockerfile
    container_name: ahizan_seller
    restart: unless-stopped
    privileged: true
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      - VENDURE_SHOP_API_URL=http://ahizan_backend:3000/shop-api
      - NEXT_PUBLIC_VENDURE_SHOP_API_URL=https://api.ahizan.com/shop-api
    labels:
      - "VIRTUAL_HOST=seller.ahizan.com"
      - "VIRTUAL_PORT=3000"
    networks:
      - web
      - internal
    logging: *default-logging

  auth:
    image: ahizan-auth
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    container_name: ahizan_auth
    restart: unless-stopped
    privileged: true
    ports:
      - "3003:3000"
    env_file: .env
    environment:
      - VENDURE_SHOP_API_URL=http://ahizan_backend:3000/shop-api
      - NEXT_PUBLIC_VENDURE_SHOP_API_URL=https://api.ahizan.com/shop-api
    labels:
      - "VIRTUAL_HOST=auth.ahizan.com"
      - "VIRTUAL_PORT=3000"
    networks:
      - web
      - internal
    logging: *default-logging

  media:
    image: ahizan-media
    build: ./docker/media
    container_name: ahizan_media
    restart: unless-stopped
    privileged: true
    ports:
      - "80"
    volumes:
      - ./backend/static/assets:/srv/ahizan/storage
    depends_on:
      - db
    labels:
      - "VIRTUAL_HOST=media.ahizan.com"
      - "VIRTUAL_PORT=80"
    networks:
      - web
    logging: *default-logging

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: ahizan_db
    restart: unless-stopped
    privileged: true
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    # Pas de port mapping nécessaire, communication interne Docker uniquement
    logging: *default-logging

  ai:
    image: node:22-alpine
    container_name: ahizan_ai
    restart: unless-stopped
    ports:
      - "3005:3005"
    working_dir: /app
    env_file: ./ahizan-ai/.env
    volumes:
      - ./ahizan-ai:/app
    command: node dist/index.js
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - "VIRTUAL_HOST=ai.ahizan.com"
      - "VIRTUAL_PORT=3005"
    networks:
      - web
      - internal
    logging: *default-logging

volumes:
  db_data:

networks:
  web:
    external: true
  internal:
    driver: bridge
